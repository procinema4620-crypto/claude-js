<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>selector(선택자) | CSS 연습</title>
    <meta name="description" content="아이디 선택자(#), 클래스 선택자(.), 태그 선택자를 사용해 h1, p, strong 요소에 서로 다른 스타일을 적용하는 방법을 하나씩 비교하며 연습하는 CSS 선택자 예제 페이지입니다. 실습 결과를 브라우저에서 바로 확인할 수 있습니다.">
    <meta property="og:title" content="selector(선택자) | CSS 연습">
    <meta property="og:description" content="아이디 선택자(#), 클래스 선택자(.), 태그 선택자를 사용해 h1, p, strong 요소에 서로 다른 스타일을 적용하는 방법을 하나씩 비교하며 연습하는 CSS 선택자 예제 페이지입니다. 실습 결과를 브라우저에서 바로 확인할 수 있습니다.">
    <link rel="stylesheet" href="./style/selector.css">
</head>
<body>
    <main>
        <h1 id="h1-tag">아이디 선택자(#)</h1>
        <p class="p-tag">클래스 선택자(.)</p>
        <strong>태그 선택자</strong>
    </main>
</body>
</html>
