<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>선택자 기본 예제 | CSS 연습</title>
    <meta name="description" content="외부 CSS 파일을 연결해 아이디 선택자와 클래스 선택자, 태그 선택자가 각각 h1, p, strong 요소에 적용되는 모습을 확인해 보는 CSS 선택자 기본 예제 페이지로 style 폴더에 있습니다. 실습 결과를 브라우저에서 바로 확인할 수 있습니다.">
    <meta property="og:title" content="선택자 기본 예제 | CSS 연습">
    <meta property="og:description" content="외부 CSS 파일을 연결해 아이디 선택자와 클래스 선택자, 태그 선택자가 각각 h1, p, strong 요소에 적용되는 모습을 확인해 보는 CSS 선택자 기본 예제 페이지로 style 폴더에 있습니다. 실습 결과를 브라우저에서 바로 확인할 수 있습니다.">
    <link rel="stylesheet" href="selector.css">
</head>
<body>
    <main>
        <h1 id="h1-tag">아이디 선택자</h1>
        <p class="p-tag">클래스 선택자</p>
        <strong>태그 선택자</strong>
    </main>
</body>
</html>
